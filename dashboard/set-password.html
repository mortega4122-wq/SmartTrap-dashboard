<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Set your password — VerdanTech Dashboard</title>

  <script>
    // Grab any error from the email link before supabase-js clears the URL hash.
    const LINK_ERROR = new URLSearchParams(location.hash.slice(1)).get("error_description");
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth-pages.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>

<main class="auth-wrap">
  <a class="wordmark" href="../index.html" aria-label="VerdanTech Solutions website">
    <span class="wordmark-verdan">Verdan</span><span class="wordmark-tech">Tech</span>
    <span class="wordmark-sub">SmartTrap Dashboard</span>
  </a>

  <div class="auth-card">
    <h1>Set your password</h1>
    <p class="auth-sub" id="card-sub">Checking your link…</p>

    <form id="password-form" hidden>
      <label>New password <input type="password" id="password" autocomplete="new-password" minlength="8" required></label>
      <label>Confirm password <input type="password" id="confirm" autocomplete="new-password" minlength="8" required></label>
      <button class="primary-btn" id="save-btn" type="submit">Save password</button>
    </form>

    <div class="auth-status" id="status" role="status" aria-live="polite"></div>
    <a class="link-btn" id="login-link" href="login.html" hidden>Go to sign in</a>
  </div>

  <a class="auth-back" href="../index.html">← Back to the VerdanTech website</a>
</main>

<script>
  const statusEl = document.getElementById("status");
  function setStatus(text, type = "") {
    statusEl.textContent = text;
    statusEl.className = `auth-status ${type}`;
  }

  // supabase-js signs the user in from the invite/reset link's hash while it initializes.
  sb.auth.getSession().then(({ data: { session } }) => {
    const sub = document.getElementById("card-sub");
    if (session) {
      sub.textContent = "Choose a password with at least 8 characters.";
      document.getElementById("password-form").hidden = false;
    } else {
      sub.textContent = LINK_ERROR
        ? `${LINK_ERROR}. Request a new link from the sign-in page.`
        : "This link is invalid or has expired. Request a new one from the sign-in page with “Forgot your password?”.";
      document.getElementById("login-link").hidden = false;
    }
  });

  document.getElementById("password-form").addEventListener("submit", async e => {
    e.preventDefault();
    const password = document.getElementById("password").value;
    if (password !== document.getElementById("confirm").value) {
      setStatus("Passwords don't match.", "error");
      return;
    }

    const btn = document.getElementById("save-btn");
    btn.disabled = true;
    btn.textContent = "Saving…";
    setStatus("");

    const { error } = await sb.auth.updateUser({ password });
    if (error) {
      setStatus(error.message, "error");
      btn.disabled = false;
      btn.textContent = "Save password";
      return;
    }
    setStatus("Password saved. Opening your dashboard…", "success");
    setTimeout(() => location.replace("index.html"), 1000);
  });
</script>
</body>
</html>
