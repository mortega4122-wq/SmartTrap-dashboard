<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orchard setup — SmartTrap</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>requireLogin();</script>

  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/traps.js"></script>
</head>
<body class="app-fixed">

<header class="app-header">
  <a class="wordmark" href="../index.html" title="VerdanTech website"><span>Verdan</span><span class="wordmark-tech">Tech</span></a>
  <nav class="app-nav" aria-label="Dashboard">
    <a href="index.html">Map</a>
    <a href="orchard-setup.html" aria-current="page">Orchard setup</a>
    <a href="layout.html">Layout</a>
    <a href="scan.html">Add trap</a>
  </nav>
  <div class="app-header-end">
    <button class="btn btn-outline btn-sm" type="button" onclick="signOut()">Sign out</button>
  </div>
</header>

<div class="toolbar">
  <span class="label">Boundary</span>
  <button class="btn btn-outline btn-sm" type="button" id="btn-draw" aria-pressed="false" onclick="startDrawing()">Draw orchard</button>
  <button class="btn btn-outline btn-sm" type="button" id="btn-clear" onclick="clearBoundary()">Clear</button>
  <span class="toolbar-divider"></span>
  <span class="label">Coverage</span>
  <button class="btn btn-outline btn-sm" type="button" id="btn-radius" aria-pressed="true" onclick="toggleRadius()">1-mile radius</button>
  <span class="toolbar-divider"></span>
  <span class="toolbar-status" id="status" role="status"></span>
  <a class="btn btn-outline btn-sm" id="next-step" href="layout.html" hidden>Plan trap layout →</a>
  <button class="btn btn-primary btn-sm toolbar-end" type="button" id="btn-save" onclick="saveBoundary()" disabled>Save boundary</button>
</div>

<main class="map-area" style="flex:1" aria-label="Orchard map">
  <div id="map"></div>
  <p class="map-notice" id="draw-hint" hidden>Click to place boundary points. Double-click to finish.</p>
  <div class="map-panel key" id="map-key"></div>
</main>

<script>
  const PHEROMONE_RADIUS_M = 1609.34;

  async function fetchBoundary() {
    const rows = await sbGet("orchard_boundaries?select=id,polygon_points&order=id.asc&limit=1");
    return Array.isArray(rows) && rows.length > 0 ? rows[0] : null;
  }

  // ── MAP INIT ─────────────────────────────────────────
  document.getElementById("map").style.cssText = "position:absolute;inset:0";
  const map = L.map("map", { zoomControl: true }).setView(DEFAULT_CENTER, 14);
  addImagery(map);
  setupMapKey(document.getElementById("map-key"), "setup", "smarttrap-setup-key", true);

  // ── STATE ────────────────────────────────────────────
  const BOUNDARY_COLOR = "#FFC72C";
  let drawingActive = false;
  let clickPoints   = [];       // [{lat, lng}, ...]
  let showRadius    = true;

  const boundaryGroup = L.layerGroup().addTo(map);
  const radiusGroup   = L.layerGroup().addTo(map);
  const nodeGroup     = L.layerGroup().addTo(map);

  // ── UI ───────────────────────────────────────────────
  function setStatus(msg, kind) {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.className   = "toolbar-status" + (kind ? ` is-${kind}` : "");
  }

  function setDrawButton(active) {
    const btn = document.getElementById("btn-draw");
    btn.setAttribute("aria-pressed", String(active));
    btn.textContent = active ? "Stop drawing" : "Draw orchard";
    document.getElementById("draw-hint").hidden = !active;
    map.getContainer().style.cursor = active ? "crosshair" : "";
  }

  function startDrawing() {
    drawingActive = !drawingActive;
    if (drawingActive) {
      clickPoints = [];
      redraw();
      setDrawButton(true);
      setStatus("Click to place points. Double-click to finish.", "");
    } else {
      finishDrawing();
    }
  }

  function finishDrawing() {
    drawingActive = false;
    setDrawButton(false);
    redraw();
    if (clickPoints.length >= 3) {
      document.getElementById("btn-save").disabled = false;
      setStatus(`${clickPoints.length} points. Ready to save.`, "success");
    } else if (clickPoints.length > 0) {
      setStatus("A boundary needs at least 3 points.", "error");
    } else {
      setStatus("", "");
    }
  }

  function clearBoundary() {
    clickPoints = []; drawingActive = false;
    setDrawButton(false);
    document.getElementById("btn-save").disabled = true;
    setStatus("Boundary cleared.", "");
    redraw();
  }

  function toggleRadius() {
    showRadius = !showRadius;
    if (showRadius) radiusGroup.addTo(map); else map.removeLayer(radiusGroup);
    document.getElementById("btn-radius").setAttribute("aria-pressed", String(showRadius));
  }

  async function saveBoundary() {
    if (clickPoints.length < 3) { setStatus("A boundary needs at least 3 points.", "error"); return; }
    const btn = document.getElementById("btn-save");
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      const existing = await fetchBoundary();
      const payload  = { polygon_points: clickPoints, updated_at: new Date().toISOString() };
      const res = existing
        ? await sbWrite(`orchard_boundaries?id=eq.${existing.id}`, "PATCH", payload)
        : await sbWrite("orchard_boundaries", "POST", { name: "Orchard 1", ...payload });
      setStatus(res.ok ? `Saved. ${clickPoints.length} points.` : `Couldn't save (${res.status}).`, res.ok ? "success" : "error");
      // The boundary is only step one; point at the step that uses it.
      if (res.ok) document.getElementById("next-step").hidden = false;
    } catch (e) { setStatus("Couldn't save: " + e.message, "error"); }
    btn.textContent = "Save boundary";
    btn.disabled = false;
  }

  // ── BOUNDARY DRAWING ─────────────────────────────────
  function redraw() {
    boundaryGroup.clearLayers();
    if (clickPoints.length === 0) return;

    clickPoints.forEach((pt, i) => {
      L.circleMarker([pt.lat, pt.lng], {
        radius: i === 0 ? 7 : 5, color: "#1c261d", weight: 1.5,
        fillColor: BOUNDARY_COLOR, fillOpacity: 1
      }).addTo(boundaryGroup);
    });

    if (clickPoints.length > 1) {
      const latlngs = clickPoints.map(p => [p.lat, p.lng]);
      L.polyline(drawingActive ? latlngs : [...latlngs, latlngs[0]], {
        color: BOUNDARY_COLOR, weight: drawingActive ? 2.5 : 3,
        dashArray: drawingActive ? "6,4" : null, opacity: 1
      }).addTo(boundaryGroup);
    }

    if (!drawingActive && clickPoints.length >= 3) {
      L.polygon(clickPoints.map(p => [p.lat, p.lng]), {
        color: BOUNDARY_COLOR, weight: 3, fillColor: BOUNDARY_COLOR, fillOpacity: 0.07
      }).addTo(boundaryGroup);
    }
  }

  // ── MAP CLICK HANDLERS ───────────────────────────────
  map.on("click", e => {
    if (!drawingActive) return;
    clickPoints.push({ lat: e.latlng.lat, lng: e.latlng.lng });
    redraw();
    setStatus(`${clickPoints.length} point${clickPoints.length > 1 ? "s" : ""} placed. Double-click to finish.`, "");
  });

  map.on("dblclick", () => {
    if (!drawingActive) return;
    // Remove the extra single-click point that fires just before double-click
    if (clickPoints.length > 0) clickPoints.pop();
    finishDrawing();
  });

  // ── LOAD DATA ────────────────────────────────────────
  (async function init() {
    let locationMap;
    try { locationMap = await fetchNodeLocations(); }
    catch (e) { setStatus("Couldn't load traps. Check your connection, then refresh.", "error"); return; }
    const entries = Object.entries(locationMap).filter(([, coords]) => coords);

    entries.forEach(([id, coords], i) => {
      L.circle(coords, {
        radius: PHEROMONE_RADIUS_M, color: "#ffffff", weight: 1.5, dashArray: "6,4",
        fillColor: "#ffffff", fillOpacity: 0.06, opacity: 0.55, interactive: false
      }).addTo(radiusGroup);
      L.marker([coords[0] + 0.0135, coords[1]], {
        icon: L.divIcon({ className: "map-anchor", html: `<div class="radius-label">1 mi radius</div>`, iconSize: [0, 0] }),
        interactive: false
      }).addTo(radiusGroup);

      L.marker(coords, { icon: trapPinIcon(trapNumber(id, i + 1)), zIndexOffset: 1000 }).addTo(nodeGroup)
        .bindPopup(`<div class="pop"><div class="pop-title">${esc(id)}</div><dl><dt>Lat</dt><dd>${coords[0].toFixed(5)}</dd><dt>Lng</dt><dd>${coords[1].toFixed(5)}</dd></dl><a class="pop-link" href="detail.html?node=${encodeURIComponent(id)}">Open trap</a></div>`);
    });

    if (entries.length === 1) map.setView(entries[0][1], 15);
    else if (entries.length > 1) map.fitBounds(L.latLngBounds(entries.map(([, c]) => c)), { paddingTopLeft: [60, 60], paddingBottomRight: [60, 180], maxZoom: 18 });

    try {
      const saved = await fetchBoundary();
      if (saved && Array.isArray(saved.polygon_points) && saved.polygon_points.length >= 3) {
        // Saved points may be stored as {longitude, latitude} from old version or {lat, lng}
        clickPoints = saved.polygon_points.map(p => ({ lat: p.lat ?? p.latitude, lng: p.lng ?? p.longitude }));
        drawingActive = false;
        redraw();
        document.getElementById("btn-save").disabled = false;
        setStatus(`Saved boundary loaded. ${clickPoints.length} points.`, "success");
      }
    } catch (e) { setStatus("Couldn't load the saved boundary.", "error"); }
  })();
</script>
</body>
</html>
