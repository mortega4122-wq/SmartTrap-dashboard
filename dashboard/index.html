<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Map — SmartTrap</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>requireLogin();</script>

  <script>
    if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      window.location.replace("index-mobile.html" + location.search);
    }
  </script>

  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/traps.js"></script>
</head>
<body class="app-fixed is-desktop-map">

<header class="app-header">
  <a class="wordmark" href="../index.html" title="VerdanTech website"><span>Verdan</span><span class="wordmark-tech">Tech</span></a>
  <nav class="app-nav" aria-label="Dashboard">
    <a href="index.html" aria-current="page">Map</a>
    <a href="orchard-setup.html">Orchard setup</a>
    <a href="scan.html">Add trap</a>
  </nav>
  <div class="app-header-end">
    <span class="app-status" id="rover-status">Loading…</span>
    <button class="btn btn-outline btn-sm" type="button" onclick="signOut()">Sign out</button>
  </div>
</header>

<main class="map-layout">
  <aside class="sidebar" aria-label="Traps">
    <section class="summary">
      <div class="summary-head"><span class="label summary-place" id="place">Your orchard</span></div>
      <div id="summary"><span class="skeleton-bar" style="height:132px"></span></div>
    </section>
    <div class="list-head"><span class="label">Traps</span><span class="label num" id="trap-count"></span></div>
    <div class="trap-list" id="trap-list"></div>
  </aside>

  <section class="map-area" aria-label="Orchard map">
    <div id="map-view"></div>

    <!-- Heatmap canvas, moved into Leaflet's overlay pane at startup -->
    <canvas id="heatmap-canvas" style="position:absolute;top:0;left:0;pointer-events:none;z-index:200;display:none;"></canvas>

    <p class="map-notice" id="no-location" hidden></p>

    <div class="map-panel heat-panel">
      <div class="heat-head">
        <span class="label">Heatmap</span>
        <span class="heat-readout" id="heat-readout" aria-live="polite" hidden></span>
      </div>
      <div class="heat-buttons" role="group" aria-label="Heatmap layer">
        <button class="btn btn-outline" type="button" id="btn-heat-temp"  aria-pressed="false" disabled onclick="toggleHeatmap('temp')"><span class="swatch swatch-temp"></span>Temp</button>
        <button class="btn btn-outline" type="button" id="btn-heat-hum"   aria-pressed="false" disabled onclick="toggleHeatmap('humidity')"><span class="swatch swatch-humidity"></span>Humidity</button>
        <button class="btn btn-outline" type="button" id="btn-heat-pest"  aria-pressed="false" disabled onclick="toggleHeatmap('pests')"><span class="swatch swatch-beetles"></span>Beetles</button>
      </div>
      <p class="heat-hint" id="heat-hint">Color the orchard by temperature, humidity, or beetles caught.</p>
      <div class="heat-scale" id="heat-scale" hidden>
        <p class="heat-title" id="heat-title"></p>
        <div class="heat-bar"><canvas id="heat-bar" aria-hidden="true"></canvas><span class="heat-marker" id="heat-marker" hidden></span></div>
        <div class="heat-ticks" id="heat-ticks"></div>
      </div>
    </div>

    <div class="map-panel key" id="map-key"></div>
  </section>
</main>

<script>
  // ── MAP ──────────────────────────────────────────────
  const map = L.map("map-view", { zoomControl: true }).setView(DEFAULT_CENTER, 15);
  addImagery(map);
  setupMapKey(document.getElementById("map-key"), "traps", "smarttrap-map-key", true);

  // The heatmap canvas lives in Leaflet's overlay pane so pixel↔latlng conversion is correct.
  const heatCanvas = document.getElementById("heatmap-canvas");
  map.getPanes().overlayPane.appendChild(heatCanvas);

  function resetCanvasTransform() {
    const topLeft = map.containerPointToLayerPoint([0, 0]);
    const size    = map.getSize();
    heatCanvas.style.transform = `translate(${topLeft.x}px,${topLeft.y}px)`;
    heatCanvas.style.width  = size.x + "px";
    heatCanvas.style.height = size.y + "px";
    heatCanvas.width  = size.x;
    heatCanvas.height = size.y;
  }

  const list = document.getElementById("trap-list");
  const pins = {};          // trap id → { marker, trap, label }
  let hotId  = null;        // trap highlighted from the list or the map

  list.innerHTML = skeletonCardsHTML(4);

  // ── LOAD ─────────────────────────────────────────────
  loadTraps().then(({ traps, pings }) => {
    document.getElementById("rover-status").textContent = roverSeenText(pings);
    document.getElementById("summary").innerHTML = summaryHTML(summarize(traps));
    document.getElementById("trap-count").textContent = traps.length;

    if (!traps.length) {
      list.innerHTML = `<p class="list-message">No traps yet. <a href="scan.html">Add a trap</a> by scanning the QR code on it.</p>`;
      return;
    }
    list.innerHTML = traps.map(trapCardHTML).join("");

    const placed  = traps.filter(t => t.coords);
    const missing = traps.length - placed.length;
    if (missing) {
      const notice = document.getElementById("no-location");
      notice.textContent = missing === 1 ? "1 trap has no location. Open it to add one." : `${missing} traps have no location. Open them to add one.`;
      notice.hidden = false;
    }

    placed.forEach((t, i) => {
      const label  = trapNumber(t.id, i + 1);
      const marker = L.marker(t.coords, { icon: trapPinIcon(label, { missed: t.status.kind === "missed" }), zIndexOffset: 1000 })
        .addTo(map).bindPopup(trapPopupHTML(t));
      marker.on("mouseover", () => setHot(t.id));
      marker.on("mouseout",  () => setHot(null));
      pins[t.id] = { marker, trap: t, label };
    });
    // Keep the traps clear of the notice at the top and the heatmap panel and key at the bottom.
    fitToTraps(map, placed, [0, 40, 0, 230]);
    drawRover(map, pings);

    heatNodeData = placed.map(t => ({ lat: t.coords[0], lng: t.coords[1], temp: t.tempF, humidity: t.humidity, pests: t.beetles }));
    document.querySelectorAll(".heat-buttons .btn").forEach(b => { b.disabled = false; });

    if (placed.length) {
      const lat = placed.reduce((s, t) => s + t.coords[0], 0) / placed.length;
      const lng = placed.reduce((s, t) => s + t.coords[1], 0) / placed.length;
      fetchNearestCity(lat, lng).then(city => { if (city) document.getElementById("place").textContent = city; });
    }
  }).catch(err => {
    console.error(err);
    document.getElementById("summary").innerHTML = "";
    document.getElementById("rover-status").textContent = "Not connected";
    list.innerHTML = `<p class="list-message is-error">Couldn't load your traps. Check your connection, then refresh the page.</p>`;
  });

  // ── LIST ↔ MAP HIGHLIGHT ─────────────────────────────
  function cardFor(id) { return id ? list.querySelector(`[data-trap="${CSS.escape(id)}"]`) : null; }

  function setHot(id) {
    if (id === hotId) return;
    [hotId, id].forEach(x => {
      const pinEl = x && pins[x]?.marker.getElement()?.querySelector(".pin");
      if (pinEl) pinEl.classList.toggle("is-hot", x === id);
      const card = cardFor(x);
      if (card) card.classList.toggle("is-hot", x === id);
    });
    hotId = id;
  }
  const cardId = e => e.target.closest(".trap-card")?.dataset.trap || null;
  list.addEventListener("pointerover", e => setHot(cardId(e)));
  list.addEventListener("pointerleave", () => setHot(null));
  list.addEventListener("focusin", e => setHot(cardId(e)));
  list.addEventListener("focusout", () => setHot(null));

  // ══════════════════════════════════════════════════════
  // HEATMAP ENGINE
  // ══════════════════════════════════════════════════════

  let heatmapActive   = null;   // 'temp' | 'humidity' | 'pests' | null
  let heatNodeData    = [];     // [{lat, lng, temp, humidity, pests}], from the trap cards
  let heatRange       = null;   // { min, span } of the active layer
  let boundaryLatLngs = [];     // [[lat,lng], ...] from the saved orchard boundary
  let boundaryLoaded  = false;

  async function fetchOrchardBoundary() {
    try {
      const rows = await sbGet("orchard_boundaries?select=polygon_points&order=id.asc&limit=1");
      const pts  = Array.isArray(rows) && rows.length ? rows[0].polygon_points : null;
      if (!Array.isArray(pts) || pts.length < 3) return [];
      // Handle both {lat,lng} and legacy {latitude,longitude} formats
      return pts.map(p => [p.lat ?? p.latitude, p.lng ?? p.longitude]);
    } catch { return []; }
  }

  // ── Point-in-polygon (ray casting) ───────────────────
  function pointInPolygon(lat, lng, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][1], yi = poly[i][0];
      const xj = poly[j][1], yj = poly[j][0];
      if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  // ── IDW interpolation ────────────────────────────────
  function idw(queryLat, queryLng, nodes, field, power = 2) {
    let weightSum = 0, valueSum = 0;
    for (const n of nodes) {
      if (n[field] === null) continue;
      const dLat = queryLat - n.lat, dLng = queryLng - n.lng;
      const dist = Math.sqrt(dLat * dLat + dLng * dLng);
      if (dist < 1e-10) return n[field]; // exactly on a trap
      const w = 1 / Math.pow(dist, power);
      weightSum += w;
      valueSum  += w * n[field];
    }
    return weightSum === 0 ? null : valueSum / weightSum;
  }

  // ── Value → RGBA ─────────────────────────────────────
  // t in [0,1] along the heatmap's stops: [position, [r, g, b, alpha 0–255]]
  function valueToColor(t, stops) {
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        const s = (t - stops[i-1][0]) / (stops[i][0] - stops[i-1][0]);
        const a = stops[i-1][1], b = stops[i][1];
        return a.map((v, k) => Math.round(v + s * (b[k] - v)));
      }
    }
    return stops[stops.length - 1][1];
  }

  // Black or white text, whichever reads better on a pin's fill.
  function inkFor(r, g, b) {
    const lin = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    return (L + 0.05) / 0.0603 >= 1.05 / (L + 0.05) ? "#141a15" : "#ffffff";
  }

  const clamp01 = v => Math.max(0, Math.min(1, v));

  // ── Heatmap settings ─────────────────────────────────
  const CLIMATE_STOPS = [   // temperature: blue → cyan → yellow → red, ~69% opacity
    [0,    [0,   0,   220, 175]],
    [0.33, [0,   200, 220, 175]],
    [0.66, [250, 220, 0,   175]],
    [1.0,  [220, 20,  20,  175]]
  ];
  const HUMIDITY_STOPS = [  // one blue ramp, pale (dry) → deep (humid)
    [0,    [224, 242, 254, 120]],
    [0.4,  [125, 211, 252, 150]],
    [0.75, [2,   132, 199, 180]],
    [1.0,  [7,   89,  133, 200]]
  ];
  const PEST_STOPS = [      // bright orange, fading out near zero so the orchard shows through
    [0,    [255, 237, 213, 0  ]],
    [0.2,  [254, 215, 170, 110]],
    [0.45, [251, 146, 60,  170]],
    [0.75, [249, 115, 22,  205]],
    [1.0,  [234, 88,  12,  225]]
  ];
  const HEATMAPS = {
    temp:     { title: "Temperature (°F)",        button: "btn-heat-temp", stops: CLIMATE_STOPS,
                tick: v => v.toFixed(1), pin: v => v.toFixed(1) + "°", readout: v => `${v.toFixed(1)} °F`, empty: "No temperature readings yet." },
    humidity: { title: "Humidity (%)",            button: "btn-heat-hum",  stops: HUMIDITY_STOPS,
                tick: v => v.toFixed(1), pin: v => Math.round(v) + "%", readout: v => `${v.toFixed(1)} %`, empty: "No humidity readings yet." },
    // Scaled from 0, not from the lowest trap, so a field with only a few beetles doesn't look like a hotspot
    pests:    { title: "Beetles caught per trap", button: "btn-heat-pest", stops: PEST_STOPS, fromZero: true, integer: true,
                tick: v => String(Math.round(v)), pin: v => String(Math.round(v)), readout: v => `${Math.round(v)} beetle${Math.round(v) === 1 ? "" : "s"}`, empty: "No beetle counts yet." }
  };

  function rangeFor(field) {
    const values = heatNodeData.map(n => n[field]).filter(v => v !== null);
    if (!values.length) return null;
    const min = HEATMAPS[field].fromZero ? 0 : Math.min(...values);
    return { min, span: (Math.max(...values) - min) || 1 };
  }

  // ── Scale under the buttons ──────────────────────────
  // Drawn with the map's own translucent colors over an orchard-green backdrop,
  // so the key looks the way the overlay looks on the imagery.
  const BACKDROP_RGB   = [77, 90, 59];
  const SCALE_BACKDROP = `rgb(${BACKDROP_RGB})`;

  // A translucent ramp color as it looks on the orchard, so a pin's chip matches
  // both the scale and the map around it instead of the raw, opaque stop color.
  function asDrawn([r, g, b, a]) {
    const k = a / 255;
    return [r, g, b].map((v, i) => Math.round(v * k + BACKDROP_RGB[i] * (1 - k)));
  }

  function drawScale(field) {
    const cfg = HEATMAPS[field], canvas = document.getElementById("heat-bar");
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.max(1, Math.round(canvas.clientWidth * dpr));
    canvas.height = Math.round(16 * dpr);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = SCALE_BACKDROP;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let x = 0; x < canvas.width; x++) {
      const [r, g, b, a] = valueToColor(x / (canvas.width - 1), cfg.stops);
      ctx.fillStyle = `rgba(${r},${g},${b},${a / 255})`;
      ctx.fillRect(x, 0, 1, canvas.height);
    }
    const { min, span } = heatRange;
    const ticks = cfg.integer && span <= 4
      ? Array.from({ length: span + 1 }, (_, i) => min + i)
      : [0, 1, 2, 3, 4].map(i => min + span * i / 4);
    document.getElementById("heat-ticks").innerHTML = ticks.map(v => `<span>${cfg.tick(v)}</span>`).join("");
    document.getElementById("heat-title").textContent = cfg.title;
  }

  function syncHeatUI() {
    Object.entries(HEATMAPS).forEach(([field, cfg]) =>
      document.getElementById(cfg.button).setAttribute("aria-pressed", String(field === heatmapActive)));
    const hint = document.getElementById("heat-hint"), scale = document.getElementById("heat-scale");
    if (!heatmapActive) {
      hint.textContent = "Color the orchard by temperature, humidity, or beetles caught.";
      hint.hidden = false; scale.hidden = true;
    } else if (!heatRange) {
      hint.textContent = HEATMAPS[heatmapActive].empty;
      hint.hidden = false; scale.hidden = true;
    } else {
      hint.hidden = true; scale.hidden = false;
      drawScale(heatmapActive);
    }
    hideReadout();
  }

  // ── Pins: numbers normally, values while a heatmap is on ──
  function refreshPins() {
    Object.values(pins).forEach(({ marker, trap, label }) => {
      const opts  = { missed: trap.status.kind === "missed", hot: trap.id === hotId };
      const value = heatmapActive ? { temp: trap.tempF, humidity: trap.humidity, pests: trap.beetles }[heatmapActive] : null;
      if (heatRange && value !== null) {
        const [r, g, b] = asDrawn(valueToColor(clamp01((value - heatRange.min) / heatRange.span), HEATMAPS[heatmapActive].stops));
        Object.assign(opts, { value: HEATMAPS[heatmapActive].pin(value), fill: `rgb(${r},${g},${b})`, ink: inkFor(r, g, b) });
      }
      marker.setIcon(trapPinIcon(label, opts));
    });
  }

  // ── Main render ──────────────────────────────────────
  function renderHeatmap(field) {
    resetCanvasTransform();
    const W = heatCanvas.width, H = heatCanvas.height;
    if (W === 0 || H === 0 || !heatRange) return;

    heatCanvas.style.display = "block";
    const ctx = heatCanvas.getContext("2d");
    ctx.clearRect(0, 0, W, H);

    const validNodes = heatNodeData.filter(n => n[field] !== null);
    if (validNodes.length === 0) return;
    const { min, span } = heatRange;

    // Geographic bounds of the current viewport, sampled on a grid
    const bounds = map.getBounds();
    const neLat = bounds.getNorth(), swLat = bounds.getSouth();
    const wLng  = bounds.getWest(),  eLng  = bounds.getEast();
    const STEPS = 120;
    const latStep = (neLat - swLat) / STEPS;
    const lngStep = (eLng  - wLng)  / STEPS;

    for (let row = 0; row <= STEPS; row++) {
      for (let col = 0; col <= STEPS; col++) {
        const lat = neLat - row * latStep;
        const lng = wLng  + col * lngStep;
        if (boundaryLatLngs.length >= 3 && !pointInPolygon(lat, lng, boundaryLatLngs)) continue;

        const val = idw(lat, lng, validNodes, field);
        if (val === null) continue;
        const [r, g, b, a] = valueToColor((val - min) / span, HEATMAPS[field].stops);

        // Snap the cell to whole pixels, ending where the next cell starts, so
        // translucent cells don't overlap into darker grid lines
        const pt   = map.latLngToContainerPoint([lat, lng]);
        const next = map.latLngToContainerPoint([lat - latStep, lng + lngStep]);
        const x = Math.round(pt.x), y = Math.round(pt.y);
        ctx.fillStyle = `rgba(${r},${g},${b},${a / 255})`;
        ctx.fillRect(x, y, Math.round(next.x) - x, Math.round(next.y) - y);
      }
    }
  }

  function clearHeatmap() {
    heatCanvas.style.display = "none";
    heatCanvas.style.transform = "";
    heatCanvas.width = 0;
    heatCanvas.height = 0;
  }

  // Hide the canvas while dragging (the pane transform makes it drift), redraw on release
  map.on("movestart", () => { if (heatmapActive) heatCanvas.style.display = "none"; });
  map.on("moveend zoomend", () => { if (heatmapActive) renderHeatmap(heatmapActive); });
  map.on("resize", () => { if (heatmapActive && heatRange) drawScale(heatmapActive); });

  async function toggleHeatmap(field) {
    if (heatmapActive === field) {
      heatmapActive = null;
      heatRange = null;
      clearHeatmap();
    } else {
      heatmapActive = field;
      if (!boundaryLoaded) { boundaryLatLngs = await fetchOrchardBoundary(); boundaryLoaded = true; }
      heatRange = rangeFor(field);
      if (heatRange) renderHeatmap(field); else clearHeatmap();
    }
    syncHeatUI();
    refreshPins();
  }

  // ── Readout: the value under the cursor, marked on the scale ──
  const readout = document.getElementById("heat-readout");
  const scaleMarker = document.getElementById("heat-marker");
  let readoutFrame = 0, pointer = null;

  function hideReadout() { readout.hidden = true; scaleMarker.hidden = true; }

  function updateReadout() {
    readoutFrame = 0;
    if (!heatmapActive || !heatRange || !pointer) return hideReadout();
    const { lat, lng } = pointer;
    if (boundaryLatLngs.length >= 3 && !pointInPolygon(lat, lng, boundaryLatLngs)) return hideReadout();
    const v = idw(lat, lng, heatNodeData, heatmapActive);
    if (v === null) return hideReadout();
    readout.textContent = `Here · ${HEATMAPS[heatmapActive].readout(v)}`;
    scaleMarker.style.left = `${clamp01((v - heatRange.min) / heatRange.span) * 100}%`;
    readout.hidden = false;
    scaleMarker.hidden = false;
  }

  map.on("mousemove", e => { pointer = e.latlng; if (!readoutFrame) readoutFrame = requestAnimationFrame(updateReadout); });
  map.on("mouseout", () => { pointer = null; hideReadout(); });
</script>
</body>
</html>
