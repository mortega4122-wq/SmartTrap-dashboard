<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartTrap</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>requireLogin();</script>

  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/traps.js"></script>
</head>
<body class="app-fixed">

<header class="app-header is-compact">
  <a class="wordmark" href="../index.html" title="VerdanTech website"><span>Verdan</span><span class="wordmark-tech">Tech</span></a>
  <div class="app-header-end">
    <button class="btn btn-outline btn-sm" type="button" onclick="signOut()">Sign out</button>
  </div>
</header>

<div class="tab-bar" role="tablist" aria-label="View">
  <button type="button" role="tab" id="tab-map"   aria-controls="panel-map"   aria-selected="true">Map</button>
  <button type="button" role="tab" id="tab-traps" aria-controls="panel-traps" aria-selected="false">Traps</button>
</div>

<section class="phone-panel" id="panel-map" role="tabpanel" aria-labelledby="tab-map">
  <div id="map-view"></div>
  <p class="map-notice" id="no-location" hidden></p>
  <div class="map-panel key" id="map-key"></div>
</section>

<section class="phone-panel is-scroll" id="panel-traps" role="tabpanel" aria-labelledby="tab-traps" hidden>
  <div class="summary">
    <div class="summary-head"><span class="label summary-place" id="place">Your orchard</span></div>
    <p class="summary-rover" id="rover-status">Loading…</p>
    <div id="summary"><span class="skeleton-bar" style="height:132px"></span></div>
  </div>
  <div class="list-head"><span class="label">Traps</span><span class="label num" id="trap-count"></span></div>
  <div class="trap-list" id="trap-list"></div>
  <p class="phone-footer"><a class="btn btn-outline btn-block" href="scan.html">Add a trap</a></p>
</section>

<script>
  // ── TABS ─────────────────────────────────────────────
  const map = L.map("map-view", { zoomControl: true }).setView(DEFAULT_CENTER, 15);
  addImagery(map);
  setupMapKey(document.getElementById("map-key"), "traps", "smarttrap-phone-key", false);

  document.querySelectorAll('[role="tab"]').forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll('[role="tab"]').forEach(t => {
        const on = t === tab;
        t.setAttribute("aria-selected", String(on));
        document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
      });
      if (tab.id === "tab-map") map.invalidateSize();
    });
  });

  // ── LOAD ─────────────────────────────────────────────
  const list = document.getElementById("trap-list");
  list.innerHTML = skeletonCardsHTML(3);

  loadTraps().then(({ traps, pings }) => {
    document.getElementById("rover-status").textContent = roverSeenText(pings);
    document.getElementById("summary").innerHTML = summaryHTML(summarize(traps));
    document.getElementById("trap-count").textContent = traps.length;

    if (!traps.length) {
      list.innerHTML = `<p class="list-message">No traps yet. Scan the QR code on a trap to add it.</p>`;
      return;
    }
    list.innerHTML = traps.map(trapCardHTML).join("");

    const placed  = traps.filter(t => t.coords);
    const missing = traps.length - placed.length;
    if (missing) {
      const notice = document.getElementById("no-location");
      notice.textContent = missing === 1 ? "1 trap has no location." : `${missing} traps have no location.`;
      notice.hidden = false;
    }

    placed.forEach((t, i) => {
      L.marker(t.coords, { icon: trapPinIcon(trapNumber(t.id, i + 1), { missed: t.status.kind === "missed" }), zIndexOffset: 1000 })
        .addTo(map).bindPopup(trapPopupHTML(t));
    });
    fitToTraps(map, placed, [0, 40, 0, 50]);
    drawRover(map, pings);

    if (placed.length) {
      const lat = placed.reduce((s, t) => s + t.coords[0], 0) / placed.length;
      const lng = placed.reduce((s, t) => s + t.coords[1], 0) / placed.length;
      fetchNearestCity(lat, lng).then(city => { if (city) document.getElementById("place").textContent = city; });
    }
  }).catch(err => {
    console.error(err);
    document.getElementById("summary").innerHTML = "";
    document.getElementById("rover-status").textContent = "Not connected";
    list.innerHTML = `<p class="list-message is-error">Couldn't load your traps. Check your signal, then refresh the page.</p>`;
  });
</script>
</body>
</html>
